[workspace]
resolver = "2"
members = ["crates/core", "crates/database", "crates/server", "crates/migrate"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
async-graphql = { version = "7", features = ["dynamic-schema"] }
async-graphql-axum = "7"
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "serde_json"] }
diesel-async = { version = "0.7", features = ["postgres", "pool", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
postrust-server = { git = "https://github.com/postrust/postrust", rev = "118e8d7c43497fe9145bac8a8f70246f28fd3cfb", features = ["admin-ui"] }
postrust-core = { git = "https://github.com/postrust/postrust", rev = "118e8d7c43497fe9145bac8a8f70246f28fd3cfb" }
postrust-auth = { git = "https://github.com/postrust/postrust", rev = "118e8d7c43497fe9145bac8a8f70246f28fd3cfb" }
postrust-graphql = { git = "https://github.com/postrust/postrust", rev = "118e8d7c43497fe9145bac8a8f70246f28fd3cfb" }
zc-core = { path = "crates/core" }
zc-database = { path = "crates/database", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

