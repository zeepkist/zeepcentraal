[workspace]
resolver = "2"
members = ["crates/core", "crates/database", "crates/server", "crates/migrate", "crates/discord-evaluation"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8" }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "serde_json"] }
diesel-async = { version = "0.7", features = ["postgres", "pool", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "5.5", features = ["axum_extras"] }
scalar_api_reference = "=0.2.2"
zc-core = { path = "crates/core" }
zc-database = { path = "crates/database", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
