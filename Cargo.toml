[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/database",
    "crates/discord",
    "crates/discord-evaluation",
    "crates/import-zsl",
    "crates/http-benchmark",
    "crates/inspector-zeep",
    "crates/jobs",
    "crates/lobby-host",
    "crates/migrate",
    "crates/server",
    "crates/telemetry",
    "crates/test-support",
    "crates/workshop",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "json", "macros", "tokio"] }
base64 = "0.22"
bytes = "1"
flate2 = "1"
diesel = { version = "2.3", default-features = false, features = ["32-column-tables", "postgres_backend", "serde_json"] }
diesel-async = { version = "0.7", features = ["postgres", "pool", "bb8", "migrations"] }
diesel_migrations = "2.3"
hmac = "0.12"
jiff = { version = "0.2", features = ["serde"] }
jwt = "0.16"
lzma-rs = "0.3"
opentelemetry = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["logs", "metrics", "rt-tokio", "trace"] }
prost = "0.14"
pq-sys = { version = "0.7", features = ["bundled"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
ryu-js = "1.0"
rustls = "0.23"
s3 = "0.1.36"
scalar_api_reference = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha1 = "0.10"
sha2 = "0.10"
steam-client-rs = "0.2"
steam-rs = "0.5"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
utoipa = { version = "5.5", features = ["axum_extras", "ulid", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serenity = { git = "https://github.com/serenity-rs/serenity.git", rev = "86866e9a20dc441faac7b38c68a3cf78721ded1c", default-features = false, features = ["builder", "gateway", "http", "model", "rustls_backend", "transport_compression_zlib"] }
zc-core = { path = "crates/core" }
zc-database = { path = "crates/database" }
zc-telemetry = { path = "crates/telemetry" }
zc-workshop = { path = "crates/workshop" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
