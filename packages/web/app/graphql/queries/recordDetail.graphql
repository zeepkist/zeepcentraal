fragment ZC_GhostComparisonRecord on Record {
	id
	time
	dateCreated
	dateUpdated
	splits
	speeds
	levelId
	userId
	user {
		id
		steamId
		steamName
	}
	recordMedia {
		ghostUrl
		dateCreated
		dateUpdated
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	worldRecordGlobals(first: 0) {
		totalCount
	}
}

