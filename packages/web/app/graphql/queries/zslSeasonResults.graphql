fragment ZC_ZslSeasonStandingFields on ZslSeasonResult {
	position
	points
	userId
	user {
		id
		steamId
		steamName
	}
}

query ZC_ZslSeasonResults(
	$id: Int!
	$viewerId: Int!
	$includeViewer: Boolean!
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
) {
	zslSeasonResults(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { seasonId: { equalTo: $id } }
		orderBy: [POSITION_ASC]
	) {
		edges {
			cursor
			node {
				...ZC_ZslSeasonStandingFields
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
	viewerStanding: zslSeasonResults(
		first: 1
		filter: { seasonId: { equalTo: $id }, userId: { equalTo: $viewerId } }
	) @include(if: $includeViewer) {
		nodes {
			...ZC_ZslSeasonStandingFields
		}
	}
}
