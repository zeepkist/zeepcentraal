query ZC_LevelPointsHistory($levelId: Int!, $since: Datetime!) {
	baseline: levelPointsHistories(
		first: 1
		filter: { levelId: { equalTo: $levelId }, dateCreated: { lessThan: $since } }
		orderBy: [DATE_CREATED_DESC, ID_DESC]
	) {
		nodes {
			dateCreated
			points
		}
	}
	history: levelPointsHistories(
		first: 0
		filter: { levelId: { equalTo: $levelId }, dateCreated: { greaterThanOrEqualTo: $since } }
	) {
		groupedAggregates(groupBy: [DATE_CREATED]) {
			keys
			max {
				points
			}
		}
	}
}
