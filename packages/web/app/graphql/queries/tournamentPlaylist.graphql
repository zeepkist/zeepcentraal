fragment ZC_TrackTournamentPlaylistEntry on TrackTournament {
	id
	type
	slug
	startAt
	level {
		levelItems(
			first: 1
			filter: { deleted: { equalTo: false } }
			orderBy: [UPDATED_AT_DESC, ID_DESC]
		) {
			nodes {
				fileUid
				workshopId
				name
				fileAuthor
				validationTimeAuthor
			}
		}
		worldRecordGlobal {
			record {
				time
			}
		}
	}
}

query ZC_TrackTournamentPlaylist($first: Int!, $after: Cursor, $filter: TrackTournamentFilter!) {
	trackTournaments(
		first: $first
		after: $after
		filter: $filter
		orderBy: [START_AT_DESC, ID_DESC]
	) {
		nodes {
			...ZC_TrackTournamentPlaylistEntry
		}
		pageInfo {
			endCursor
			hasNextPage
		}
	}
}
