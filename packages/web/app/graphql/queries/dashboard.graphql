fragment ZC_DashboardLevel on Level {
	id
	xxHash
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
	levelPoints {
		points
		rating
		modifierPopularity
	}
	records(first: 0) {
		totalCount
	}
}

fragment ZC_DashboardMetricCounts on Query {
	records(first: 0) {
		totalCount
	}
	recordsDay: records(first: 0, filter: { dateCreated: { greaterThanOrEqualTo: $daySince } }) {
		totalCount
	}
	recordsMonth: records(
		first: 0
		filter: { dateCreated: { greaterThanOrEqualTo: $monthSince } }
	) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	personalBestGlobalsDay: personalBestGlobals(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $daySince } } }
	) {
		totalCount
	}
	personalBestGlobalsMonth: personalBestGlobals(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $monthSince } } }
	) {
		totalCount
	}
	worldRecordGlobals(first: 0) {
		totalCount
	}
	worldRecordGlobalsDay: worldRecordGlobals(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $daySince } } }
	) {
		totalCount
	}
	worldRecordGlobalsMonth: worldRecordGlobals(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $monthSince } } }
	) {
		totalCount
	}
	levels(first: 0) {
		totalCount
	}
	levelsDay: levels(first: 0, filter: { dateCreated: { greaterThanOrEqualTo: $daySince } }) {
		totalCount
	}
	levelsMonth: levels(first: 0, filter: { dateCreated: { greaterThanOrEqualTo: $monthSince } }) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	votesDay: votes(first: 0, filter: { dateCreated: { greaterThanOrEqualTo: $daySince } }) {
		totalCount
	}
	votesMonth: votes(first: 0, filter: { dateCreated: { greaterThanOrEqualTo: $monthSince } }) {
		totalCount
	}
	totalUsers: users(first: 0, filter: { banned: { equalTo: false } }) {
		totalCount
	}
	rankedUsers: users(
		first: 0
		filter: {
			banned: { equalTo: false }
			userPointExists: true
			userPoints: { rank: { notEqualTo: -1 } }
		}
	) {
		totalCount
	}
	activeUsersDay: users(
		first: 0
		filter: {
			banned: { equalTo: false }
			or: [
				{ records: { some: { dateCreated: { greaterThanOrEqualTo: $daySince } } } }
				{
					levelItems: {
						some: {
							createdAt: { greaterThanOrEqualTo: $daySince }
							deleted: { equalTo: false }
						}
					}
				}
				{
					zslLevelResults: {
						some: {
							level: { round: { eventDate: { greaterThanOrEqualTo: $daySince } } }
						}
					}
				}
			]
		}
	) {
		totalCount
	}
	activeUsersMonth: users(
		first: 0
		filter: {
			banned: { equalTo: false }
			or: [
				{ records: { some: { dateCreated: { greaterThanOrEqualTo: $monthSince } } } }
				{
					levelItems: {
						some: {
							createdAt: { greaterThanOrEqualTo: $monthSince }
							deleted: { equalTo: false }
						}
					}
				}
				{
					zslLevelResults: {
						some: {
							level: { round: { eventDate: { greaterThanOrEqualTo: $monthSince } } }
						}
					}
				}
			]
		}
	) {
		totalCount
	}
}

query ZC_DashboardCritical($daySince: Datetime!, $monthSince: Datetime!) {
	...ZC_DashboardMetricCounts
	popularLevels: levels(
		first: 6
		filter: { levelPointExists: true, levelItems: { some: { deleted: { equalTo: false } } } }
		orderBy: [LEVEL_POINTS_MODIFIER_POPULARITY_DESC]
	) {
		nodes {
			...ZC_DashboardLevel
		}
	}
}

query ZC_DashboardLatestLevels {
	latestLevels: levels(
		first: 6
		filter: { levelItems: { some: { deleted: { equalTo: false } } } }
		orderBy: [DATE_CREATED_DESC]
	) {
		nodes {
			...ZC_DashboardLevel
		}
	}
}

query ZC_DashboardStatistics {
	recordStatistics(first: 0) {
		aggregates {
			sum {
				distance
				distanceInAir
				distanceRagdoll
				time
				timeInAir
				hornCount
				brakeCount
			}
		}
	}
}
