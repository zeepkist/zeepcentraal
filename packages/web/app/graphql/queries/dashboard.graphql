fragment ZC_DashboardLevel on Level {
	id
	xxHash
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
	levelPoints {
		points
		rating
		modifierPopularity
	}
	records(first: 0) {
		totalCount
	}
}

fragment ZC_DashboardRecord on Record {
	id
	time
	dateCreated
	levelId
	userId
	user {
		steamId
		steamName
	}
	level {
		xxHash
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
			}
		}
	}
}

query ZC_Dashboard($activeSince: Datetime!) {
	popularLevels: levels(
		first: 8
		filter: { levelPointExists: true, levelItems: { some: { deleted: { equalTo: false } } } }
		orderBy: [LEVEL_POINTS_MODIFIER_POPULARITY_DESC]
	) {
		nodes {
			...ZC_DashboardLevel
		}
	}
	latestLevels: levels(
		first: 8
		filter: { levelItems: { some: { deleted: { equalTo: false } } } }
		orderBy: [DATE_CREATED_DESC]
	) {
		nodes {
			...ZC_DashboardLevel
		}
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	worldRecordGlobals(first: 0) {
		totalCount
	}
	levels(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	activeRecords: records(
		first: 0
		filter: { dateCreated: { greaterThanOrEqualTo: $activeSince } }
	) {
		aggregates {
			distinctCount {
				userId
			}
		}
	}
	recordStatistics(first: 0) {
		aggregates {
			sum {
				distance
				distanceInAir
				distanceRagdoll
				time
				timeInAir
				hornCount
				brakeCount
			}
		}
	}
	recentWorldRecords: worldRecordGlobals(first: 10, orderBy: [DATE_UPDATED_DESC]) {
		nodes {
			record {
				...ZC_DashboardRecord
			}
		}
	}
	recentPersonalBests: personalBestGlobals(first: 10, orderBy: [DATE_UPDATED_DESC]) {
		nodes {
			record {
				...ZC_DashboardRecord
			}
		}
	}
}
