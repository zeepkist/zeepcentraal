fragment ZC_LevelSplitRecord on Record {
	id
	time
	splits
	speeds
	user {
		steamId
		steamName
	}
}

query ZC_LevelSplitAnalysis($levelId: Int!, $viewerId: Int!, $includeViewer: Boolean!) {
	records(
		first: 5
		filter: {
			levelId: { equalTo: $levelId }
			personalBestGlobalsExist: true
			splits: { isNull: false }
			speeds: { isNull: false }
		}
		orderBy: [TIME_ASC, ID_ASC]
	) {
		nodes {
			...ZC_LevelSplitRecord
		}
	}
	viewerPersonalBest: personalBestGlobalByUserIdAndLevelId(userId: $viewerId, levelId: $levelId)
		@include(if: $includeViewer)
	{
		record {
			...ZC_LevelSplitRecord
		}
	}
}
