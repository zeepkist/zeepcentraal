query ZC_DashboardHeroSummary($id: Int!) {
	user(id: $id) {
		id
		steamId
		steamName
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		worldRecordGlobals(first: 0) {
			totalCount
		}
		userPoints {
			rank
			points
			totalPoints
			worldRecords
		}
	}
	zslSeasons(first: 1, orderBy: [START_DATE_DESC]) {
		nodes {
			id
			name
			zslSeasonResults(first: 1, filter: { userId: { equalTo: $id } }) {
				nodes {
					position
					points
				}
			}
		}
	}
}

query ZC_DashboardViewerLevels($id: Int!) {
	user(id: $id) {
		levelItems(first: 6, filter: { deleted: { equalTo: false } }, orderBy: [CREATED_AT_DESC]) {
			nodes {
				level {
					id
					xxHash
					adventure
					dateCreated
					levelPoints {
						points
						rating
						modifierPopularity
					}
					records(first: 0) {
						totalCount
					}
				}
				name
				imageUrl
				author {
					steamId
					steamName
				}
				validationTimeAuthor
				validationTimeGold
				validationTimeSilver
				validationTimeBronze
			}
		}
	}
}
