query ZC_DashboardViewer($id: Int!) {
	user(id: $id) {
		id
		steamId
		steamName
		records(first: 5, orderBy: [DATE_CREATED_DESC]) {
			totalCount
			nodes {
				id
				time
				dateCreated
				levelId
				userId
				user {
					steamId
					steamName
				}
				level {
					xxHash
					levelItems(
						first: 1
						filter: { deleted: { equalTo: false } }
						orderBy: [UPDATED_AT_DESC]
					) {
						nodes {
							name
						}
					}
				}
			}
		}
		personalBestGlobals(first: 5, orderBy: [DATE_UPDATED_DESC]) {
			totalCount
			nodes {
				record {
					id
					time
					dateCreated
					levelId
					userId
					level {
						xxHash
						levelItems(first: 1, filter: { deleted: { equalTo: false } }) {
							nodes {
								name
							}
						}
					}
				}
			}
		}
		worldRecordGlobals(first: 5, orderBy: [DATE_UPDATED_DESC]) {
			totalCount
			nodes {
				record {
					id
					time
					dateCreated
					levelId
					userId
					level {
						xxHash
						levelItems(first: 1, filter: { deleted: { equalTo: false } }) {
							nodes {
								name
							}
						}
					}
				}
			}
		}
		levelItems(first: 6, filter: { deleted: { equalTo: false } }, orderBy: [CREATED_AT_DESC]) {
			nodes {
				level {
					id
					xxHash
					adventure
					dateCreated
					levelPoints {
						points
						rating
						modifierPopularity
					}
					records(first: 0) {
						totalCount
					}
				}
				name
				imageUrl
				author {
					steamId
					steamName
				}
				validationTimeAuthor
				validationTimeGold
				validationTimeSilver
				validationTimeBronze
			}
		}
	}
}
