query ZC_MyRecordCount($id: Int!) {
	user(id: $id) {
		records(first: 0) {
			totalCount
		}
	}
}

fragment ZC_RecordHistoryRow on Record {
	id
	time
	dateCreated
	levelId
	userId
	user {
		steamId
		steamName
	}
	level {
		xxHash
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
			}
		}
	}
	userPointContributions(first: 1) {
		nodes {
			levelPosition
			contributionRank
			levelPoints
			playerDecayedPoints
			levelDecayedPoints
		}
	}
}

query ZC_RecordHistory(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: RecordFilter!
	$orderBy: [RecordsOrderBy!]!
) {
	records(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			cursor
			node {
				...ZC_RecordHistoryRow
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
