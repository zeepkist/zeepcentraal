fragment ZC_AdventureLevelCard on Level {
	id
	xxHash
	adventure
	dateCreated
	levelPoints {
		points
		rating
		modifierPopularity
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	worldRecordGlobal {
		record {
			time
		}
		user {
			steamId
			steamName
		}
	}
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
}

