query ZC_AdventureLevels {
	levels(first: 100, filter: { adventure: { equalTo: true } }, orderBy: [DATE_CREATED_ASC]) {
		nodes {
			id
			xxHash
			adventure
			dateCreated
			levelPoints {
				points
				rating
				modifierPopularity
			}
			records(first: 0) {
				totalCount
			}
			levelItems(
				first: 1
				filter: { deleted: { equalTo: false } }
				orderBy: [UPDATED_AT_DESC]
			) {
				nodes {
					name
					imageUrl
					author {
						steamId
						steamName
					}
				}
			}
		}
	}
}
