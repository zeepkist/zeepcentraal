query ZC_AdventureSeries($prefix: String!) {
	levels(
		first: 1000
		filter: {
			adventure: { equalTo: true }
			levelItems: {
				some: { deleted: { equalTo: false }, name: { startsWithInsensitive: $prefix } }
			}
		}
		orderBy: [DATE_CREATED_ASC]
	) {
		nodes {
			...ZC_AdventureLevelCard
		}
	}
}
