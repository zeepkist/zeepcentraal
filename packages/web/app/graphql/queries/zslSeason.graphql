query ZC_ZslSeason($id: Int!, $first: Int, $after: Cursor, $last: Int, $before: Cursor) {
	zslSeason(id: $id) {
		id
		name
		startDate
		endDate
		zslRounds(first: 6, orderBy: [ROUND_ASC]) {
			nodes {
				id
				round
				name
				eventDate
			}
		}
	}
	zslSeasonResults(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { seasonId: { equalTo: $id } }
		orderBy: [POSITION_ASC]
	) {
		edges {
			cursor
			node {
				position
				points
				user {
					steamId
					steamName
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
