query ZC_LevelDetail($xxHash: String!) {
	levelByXxHash(xxHash: $xxHash) {
		id
		xxHash
		adventure
		dateCreated
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
				imageUrl
				authorId
				workshopId
				validationTimeAuthor
				validationTimeGold
				validationTimeSilver
				validationTimeBronze
				author {
					id
					steamId
					steamName
				}
			}
		}
		levelPoints {
			points
			rating
			modifierCompetitiveness
		}
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		votes(first: 0) {
			totalCount
		}
		favourites(first: 0) {
			totalCount
		}
		worldRecordGlobal {
			record {
				id
				time
				dateCreated
				levelId
				userId
				recordStatistic {
					distance
				}
			}
			user {
				id
				steamId
				steamName
			}
		}
	}
}
