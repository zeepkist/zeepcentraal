query ZC_LevelDetail($xxHash: String!) {
	levelByXxHash(xxHash: $xxHash) {
		id
		xxHash
		publiclyVisible
		adventure
		dateCreated
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
				imageUrl
				authorId
				workshopId
				validationTimeAuthor
				validationTimeGold
				validationTimeSilver
				validationTimeBronze
				author {
					id
					steamId
					steamName
				}
			}
		}
		levelPoints {
			points
			rating
			modifierCompetitiveness
			modifierRating
			sampleSize
			leaderboardConfidence
			inputSampleSize
			inputCoverage
			airSampleSize
			wheelSampleSize
			slipSampleSize
			ragdollSampleSize
			stateSampleSize
			surfaceSampleSize
			velocitySampleSize
			competitivenessScore
			worldRecordDifficultyScore
			participationScore
			passivePlaySeverity
			modifierAfk
			passiveRunRatio
			passiveTop10Share
			bestPassiveRank
			bestPassiveGap
			driverEngagementScore
			worldRecordMargin
			top5Spread
			top10Spread
			top50Spread
			wrChallengerCount
			worldRecordOptimizationScore
			leaderboardAnomalyScore
			telemetryAnomalyScore
			worldRecordExcluded
			pathConsistencyScore
			speedConsistencyScore
			routeConsistencyScore
			surfaceDiversityScore
			matureVoteCount
			typicalDistance
			typicalAverageSpeed
			typicalMaxSpeed
			typicalAirTimeShare
			typicalGroundTimeShare
			typicalSlipShare
			typicalRagdollShare
			typicalAverageAngularVelocity
			typicalAverageGforce
			medianSteeringShare
			q25SteeringShare
			lowSteeringRatio
			zeroControlRatio
			medianBrakeShare
			medianArmsUpShare
			medianControlTransitionRate
		}
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		votes(first: 0) {
			totalCount
		}
		favourites(first: 0) {
			totalCount
		}
		worldRecordGlobal {
			record {
				id
				time
				dateCreated
				levelId
				userId
				recordStatistic {
					distance
				}
			}
			user {
				id
				steamId
				steamName
			}
		}
	}
}
