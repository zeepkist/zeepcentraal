query ZC_SitemapTournaments($after: Cursor) {
	zslSeasons(first: 1000, after: $after, orderBy: [ID_ASC]) {
		nodes {
			id
			dateUpdated
			dateCreated
			zslRounds(first: 6, orderBy: [ROUND_ASC]) {
				nodes {
					id
					round
					dateUpdated
					dateCreated
					zslLevels(first: 15, orderBy: [ID_ASC]) {
						nodes {
							id
							dateUpdated
							dateCreated
						}
					}
				}
			}
		}
		pageInfo {
			endCursor
			hasNextPage
		}
	}
}

query ZC_SitemapTrackTournaments($after: Cursor, $now: Datetime!) {
	trackTournaments(
		first: 1000
		after: $after
		filter: { startAt: { lessThanOrEqualTo: $now } }
		orderBy: [ID_ASC]
	) {
		nodes {
			type
			slug
			dateUpdated
			dateCreated
		}
		pageInfo {
			endCursor
			hasNextPage
		}
	}
}
