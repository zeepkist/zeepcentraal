query ZC_Levels(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: LevelFilter
	$orderBy: [LevelsOrderBy!]
) {
	levels(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			cursor
			node {
				id
				xxHash
				adventure
				dateCreated
				levelItems(
					first: 1
					filter: { deleted: { equalTo: false } }
					orderBy: [UPDATED_AT_DESC]
				) {
					nodes {
						name
						imageUrl
						validationTimeAuthor
						validationTimeGold
						validationTimeSilver
						validationTimeBronze
						author {
							steamId
							steamName
						}
					}
				}
				levelPoints {
					points
					rating
					modifierPopularity
				}
				records(first: 0) {
					totalCount
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
