fragment ZC_ZslRoundStandingFields on ZslRoundResult {
	position
	points
	userId
	user {
		id
		steamId
		steamName
	}
}

query ZC_ZslRoundResults(
	$seasonId: Int!
	$round: Int!
	$viewerId: Int!
	$includeViewer: Boolean!
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
) {
	zslRoundResults(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { round: { seasonId: { equalTo: $seasonId }, round: { equalTo: $round } } }
		orderBy: [POSITION_ASC]
	) {
		edges {
			cursor
			node {
				...ZC_ZslRoundStandingFields
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
	viewerStanding: zslRoundResults(
		first: 1
		filter: {
			round: { seasonId: { equalTo: $seasonId }, round: { equalTo: $round } }
			userId: { equalTo: $viewerId }
		}
	) @include(if: $includeViewer) {
		nodes {
			...ZC_ZslRoundStandingFields
		}
	}
}
