query ZC_ZslRoundResults(
	$seasonId: Int!
	$round: Int!
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
) {
	zslRoundResults(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { round: { seasonId: { equalTo: $seasonId }, round: { equalTo: $round } } }
		orderBy: [POSITION_ASC]
	) {
		edges {
			cursor
			node {
				position
				points
				user {
					steamId
					steamName
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
