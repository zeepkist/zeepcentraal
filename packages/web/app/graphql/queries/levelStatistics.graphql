query ZC_LevelStatistics($levelId: Int!, $minimumModVersion: String!) {
	allStatistics: recordStatistics(
		first: 0
		filter: { record: { levelId: { equalTo: $levelId } } }
	) {
		totalCount
		aggregates {
			sum {
				distance
			}
		}
	}
	v6Statistics: recordStatistics(
		first: 0
		filter: {
			record: {
				levelId: { equalTo: $levelId }
				modVersion: { greaterThanOrEqualTo: $minimumModVersion }
			}
		}
	) {
		totalCount
		aggregates {
			sum {
				distance
				distanceInAir
				distanceOn1Wheel
				distanceOn2Wheels
				distanceOn3Wheels
				distanceOn4Wheels
				distanceOnGrass
				distanceOnGround
				distanceOnIce1
				distanceOnIce2
				distanceOnIce3
				distanceOnWood
				distanceOnMud
				distanceOnSand
				distanceOnSoap
				distanceOnTarmac
				distanceRagdoll
				time
				timeInAir
				timeOnGrass
				timeOnGround
				timeOnIce1
				timeOnIce2
				timeOnIce3
				timeOnWood
				timeOnMud
				timeOnSand
				timeOnSoap
				timeOnTarmac
				timeRagdoll
				turnLeftCount
				turnRightCount
				armsUpCount
				brakeCount
				hornCount
			}
			average {
				averageGforce
				averageSpeed
			}
			max {
				maxGforce
				maxSpeed
			}
		}
	}
}
