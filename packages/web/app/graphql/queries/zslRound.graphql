query ZC_ZslRound($id: Int!, $first: Int, $after: Cursor, $last: Int, $before: Cursor) {
	zslRound(id: $id) {
		id
		round
		name
		eventDate
		seasonId
		season {
			name
		}
		zslLevels(first: 15, orderBy: [ID_ASC]) {
			nodes {
				id
				level {
					xxHash
					levelItems(
						first: 1
						filter: { deleted: { equalTo: false } }
						orderBy: [UPDATED_AT_DESC]
					) {
						nodes {
							name
							imageUrl
						}
					}
				}
			}
		}
	}
	zslRoundResults(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { roundId: { equalTo: $id } }
		orderBy: [POSITION_ASC]
	) {
		edges {
			cursor
			node {
				position
				points
				user {
					steamId
					steamName
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
