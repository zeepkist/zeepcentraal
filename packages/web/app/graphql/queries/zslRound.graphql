query ZC_ZslRound($id: Int!) {
	zslRound(id: $id) {
		id
		round
		name
		eventDate
		seasonId
		season {
			name
		}
		zslLevels(first: 15, orderBy: [ID_ASC]) {
			nodes {
				id
				level {
					xxHash
					levelItems(
						first: 1
						filter: { deleted: { equalTo: false } }
						orderBy: [UPDATED_AT_DESC]
					) {
						nodes {
							name
							imageUrl
						}
					}
				}
			}
		}
	}
}
