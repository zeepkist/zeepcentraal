subscription ZC_RecentPersonalBests {
	personalBestGlobals(first: 10, orderBy: [DATE_UPDATED_DESC]) {
		nodes {
			record {
				id
				time
				dateCreated
				levelId
				userId
				user {
					steamId
					steamName
				}
				level {
					xxHash
					levelItems(
						first: 1
						filter: { deleted: { equalTo: false } }
						orderBy: [UPDATED_AT_DESC]
					) {
						nodes {
							name
						}
					}
				}
			}
		}
	}
}
