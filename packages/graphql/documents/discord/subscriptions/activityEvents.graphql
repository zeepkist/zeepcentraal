subscription ZC_DiscordActivityEventsLive {
	discordActivityEvents(first: 100, orderBy: [ID_DESC]) {
		nodes {
			id
			kind
			levelId
			userId
			previousUserId
			recordId
			previousRecordId
			payload
			occurredAt
			level {
				id
				xxHash
				levelItems(
					first: 1
					filter: { deleted: { equalTo: false } }
					orderBy: [UPDATED_AT_DESC]
				) {
					nodes {
						name
						imageUrl
						workshopId
						author {
							id
							steamId
							steamName
							discordId
						}
					}
				}
				levelPoints {
					points
					rating
				}
				personalBestGlobals(first: 0) {
					totalCount
				}
			}
			user {
				id
				steamId
				steamName
				discordId
			}
			previousUser {
				id
				steamId
				steamName
				discordId
			}
			record {
				id
				time
				modVersion
			}
			previousRecord {
				id
				time
				modVersion
			}
		}
	}
}
