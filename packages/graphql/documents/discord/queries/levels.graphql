fragment ZC_DiscordPlaylistLevel on Level {
	id
	xxHash
	publiclyVisible
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			createdAt
			updatedAt
			author {
				id
				steamId
				steamName
				discordId
			}
		}
	}
	levelPoints {
		points
		rating
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	worldRecordGlobal {
		record {
			time
		}
		user {
			id
			steamId
			steamName
			discordId
		}
	}
}

query ZC_DiscordLevelById($id: Int!) {
	level(id: $id) {
		id
		xxHash
		publiclyVisible
		adventure
		dateCreated
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
				imageUrl
				authorId
				workshopId
				fileUid
				fileAuthor
				createdAt
				updatedAt
				author {
					id
					steamId
					steamName
					discordId
				}
			}
		}
		levelPoints {
			points
			rating
		}
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		votes(first: 0) {
			totalCount
		}
		worldRecordGlobal {
			record {
				id
				time
				modVersion
			}
			user {
				id
				steamId
				steamName
				discordId
			}
		}
	}
}

query ZC_DiscordLevelsByIds($ids: [Int!]!) {
	levels(first: 50, filter: { id: { in: $ids } }) {
		nodes {
			...ZC_DiscordPlaylistLevel
		}
	}
}

query ZC_DiscordRecentWorkshopLevels(
	$first: Int!
	$orderBy: [LevelItemsOrderBy!]!
	$levelFilter: LevelFilter!
) {
	levelItems(
		first: $first
		filter: { deleted: { equalTo: false }, level: $levelFilter }
		orderBy: $orderBy
	) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			createdAt
			updatedAt
			level {
				id
				xxHash
				publiclyVisible
				levelPoints {
					points
					rating
				}
				records(first: 0) {
					totalCount
				}
				personalBestGlobals(first: 0) {
					totalCount
				}
				worldRecordGlobal {
					record {
						time
					}
					user {
						id
						steamId
						steamName
						discordId
					}
				}
			}
		}
	}
}

query ZC_DiscordLevelDetailByHash($xxHash: String!) {
	levelByXxHash(xxHash: $xxHash) {
		id
		xxHash
		publiclyVisible
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
				imageUrl
				workshopId
				author {
					id
					steamId
					steamName
					discordId
				}
			}
		}
		levelPoints {
			points
			rating
		}
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		votes(first: 0) {
			totalCount
		}
		worldRecordGlobal {
			record {
				time
			}
			user {
				id
				steamId
				steamName
				discordId
			}
		}
	}
}

query ZC_DiscordLevelSearch($search: String!) {
	levels(
		first: 8
		filter: {
			publiclyVisible: { equalTo: true }
			levelItems: {
				some: {
					deleted: { equalTo: false }
					or: [
						{ name: { includesInsensitive: $search } }
						{ author: { steamName: { includesInsensitive: $search } } }
					]
				}
			}
		}
		orderBy: [LEVEL_POINTS_POINTS_DESC, ID_ASC]
	) {
		nodes {
			id
			xxHash
			levelItems(
				first: 1
				filter: { deleted: { equalTo: false } }
				orderBy: [UPDATED_AT_DESC]
			) {
				nodes {
					name
					imageUrl
					author {
						steamName
					}
				}
			}
			levelPoints {
				points
				rating
			}
			votes(first: 0) {
				totalCount
			}
		}
	}
}

query ZC_DiscordLevels($first: Int, $filter: LevelFilter!, $orderBy: [LevelsOrderBy!]) {
	levels(first: $first, filter: $filter, orderBy: $orderBy) {
		edges {
			node {
				...ZC_DiscordPlaylistLevel
			}
		}
	}
}

query ZC_DiscordHotLevels($first: Int, $filter: LevelFilter!, $since: Datetime!) {
	levels: hotLevelsSince(
		first: $first
		filter: { and: [$filter, { worldRecordGlobal: { record: { time: { greaterThan: 10 } } } }] }
		since: $since
	) {
		edges {
			node {
				...ZC_DiscordPlaylistLevel
			}
		}
	}
}

query ZC_DiscordLevelRecords(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: RecordFilter!
	$orderBy: [RecordsOrderBy!]
) {
	records(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			node {
				time
				userId
				user {
					id
					steamId
					steamName
					discordId
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
