fragment ZC_LevelExplorerCard on Level {
	id
	xxHash
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			createdAt
			updatedAt
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
	levelPoints {
		points
		rating
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	viewerFavourites: favourites(first: 0, filter: { userId: { equalTo: $viewerId } })
		@include(if: $includeViewer)
	{
		totalCount
	}
	worldRecordGlobal {
		record {
			time
		}
		user {
			steamId
			steamName
		}
	}
}

query ZC_Levels(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: LevelFilter
	$orderBy: [LevelsOrderBy!]
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	levels(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			cursor
			node {
				...ZC_LevelExplorerCard
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}

query ZC_HotLevels(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: LevelFilter!
	$since: Datetime!
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	levels: hotLevelsSince(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: { and: [$filter, { worldRecordGlobal: { record: { time: { greaterThan: 10 } } } }] }
		since: $since
	) {
		edges {
			cursor
			node {
				...ZC_LevelExplorerCard
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
