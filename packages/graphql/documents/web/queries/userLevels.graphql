fragment ZC_UserLevelCard on Level {
	id
	xxHash
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
	levelPoints {
		points
		rating
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	viewerFavourites: favourites(first: 0, filter: { userId: { equalTo: $viewerId } })
		@include(if: $includeViewer)
	{
		totalCount
	}
	worldRecordGlobal {
		record {
			time
		}
		user {
			steamId
			steamName
		}
	}
}

query ZC_UserLevels(
	$userId: Int!
	$steamId: BigInt!
	$since: Datetime!
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	recentUser: user(id: $userId) {
		levelItems(
			first: 6
			filter: { deleted: { equalTo: false }, level: { publiclyVisible: { equalTo: true } } }
			orderBy: [CREATED_AT_DESC]
		) {
			nodes {
				level {
					...ZC_UserLevelCard
				}
			}
		}
	}
	popularLevels: hotLevelsSince(
		first: 6
		since: $since
		filter: {
			publiclyVisible: { equalTo: true }
			levelItems: { some: { authorId: { equalTo: $steamId }, deleted: { equalTo: false } } }
			worldRecordGlobal: { record: { time: { greaterThan: 10 } } }
		}
	) {
		nodes {
			...ZC_UserLevelCard
			periodRecords: records(
				first: 0
				filter: { dateCreated: { greaterThanOrEqualTo: $since } }
			) {
				totalCount
			}
		}
	}
}

query ZC_UserFavouriteLevels(
	$userId: Int!
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	user(id: $userId) {
		favourites(
			first: $first
			after: $after
			last: $last
			before: $before
			filter: { level: { publiclyVisible: { equalTo: true } } }
			orderBy: [DATE_CREATED_DESC]
		) {
			edges {
				cursor
				node {
					level {
						...ZC_UserLevelCard
					}
				}
			}
			pageInfo {
				startCursor
				endCursor
				hasNextPage
				hasPreviousPage
			}
			totalCount
		}
	}
}
