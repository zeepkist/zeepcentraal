fragment ZC_AdventureLevelCard on Level {
	id
	xxHash
	adventure
	dateCreated
	levelPoints {
		points
		rating
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	viewerFavourites: favourites(first: 0, filter: { userId: { equalTo: $viewerId } })
		@include(if: $includeViewer)
	{
		totalCount
	}
	worldRecordGlobal {
		record {
			time
			medal
		}
		user {
			steamId
			steamName
		}
	}
	levelItems(
		first: 1
		filter: { deleted: { equalTo: false }, name: { startsWithInsensitive: $prefix } }
		orderBy: [UPDATED_AT_DESC]
	) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
}

query ZC_AdventureSeriesCounts {
	adventureLeaderboardScopes(first: 18) {
		nodes {
			series
			totalLevels
		}
	}
}

query ZC_AdventureSeries(
	$series: String!
	$prefix: String!
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	adventureLevelMemberships(
		first: 1000
		filter: { series: { equalTo: $series } }
		orderBy: [LEVEL_ID_ASC]
	) {
		nodes {
			level {
				...ZC_AdventureLevelCard
			}
		}
	}
}
