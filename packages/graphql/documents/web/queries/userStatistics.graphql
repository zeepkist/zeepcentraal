fragment ZC_UserStatisticTotals on RecordStatisticsConnection {
	totalCount
	aggregates {
		sum {
			distance
		}
	}
}
fragment ZC_UserV6StatisticAggregates on RecordStatisticAggregates {
	sum {
		distance
		distanceInAir
		distanceOn1Wheel
		distanceOn2Wheels
		distanceOn3Wheels
		distanceOn4Wheels
		distanceOnGrass
		distanceOnGround
		distanceOnIce1
		distanceOnIce2
		distanceOnIce3
		distanceOnWood
		distanceOnMud
		distanceOnSand
		distanceOnSoap
		distanceOnTarmac
		distanceRagdoll
		time
		timeInAir
		timeOnGrass
		timeOnGround
		timeOnIce1
		timeOnIce2
		timeOnIce3
		timeOnWood
		timeOnMud
		timeOnSand
		timeOnSoap
		timeOnTarmac
		timeRagdoll
		turnLeftCount
		turnRightCount
		armsUpCount
		brakeCount
		hornCount
	}
	average {
		averageGforce
		averageSpeed
	}
	max {
		maxGforce
		maxSpeed
	}
}
query ZC_UserStatistics(
	$userId: Int!
	$minimumModVersion: String!
	$daySince: Datetime!
	$monthSince: Datetime!
	$yearSince: Datetime!
) {
	allStatistics: recordStatistics(
		first: 0
		filter: { record: { userId: { equalTo: $userId } } }
	) {
		...ZC_UserStatisticTotals
	}
	dayStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $daySince }
			}
		}
	) {
		...ZC_UserStatisticTotals
	}
	monthStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $monthSince }
			}
		}
	) {
		...ZC_UserStatisticTotals
	}
	yearStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $yearSince }
			}
		}
	) {
		...ZC_UserStatisticTotals
	}
	v6Statistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				modVersion: { greaterThanOrEqualTo: $minimumModVersion }
			}
		}
	) {
		totalCount
		aggregates {
			...ZC_UserV6StatisticAggregates
		}
	}
	v6DayStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $daySince }
				modVersion: { greaterThanOrEqualTo: $minimumModVersion }
			}
		}
	) {
		totalCount
		aggregates {
			...ZC_UserV6StatisticAggregates
		}
	}
	v6MonthStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $monthSince }
				modVersion: { greaterThanOrEqualTo: $minimumModVersion }
			}
		}
	) {
		totalCount
		aggregates {
			...ZC_UserV6StatisticAggregates
		}
	}
	v6YearStatistics: recordStatistics(
		first: 0
		filter: {
			record: {
				userId: { equalTo: $userId }
				dateCreated: { greaterThanOrEqualTo: $yearSince }
				modVersion: { greaterThanOrEqualTo: $minimumModVersion }
			}
		}
	) {
		totalCount
		aggregates {
			...ZC_UserV6StatisticAggregates
		}
	}
}
