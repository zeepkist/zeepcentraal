query ZC_RecordDetail($recordId: Int!) {
	record(id: $recordId) {
		...ZC_GhostComparisonRecord
		gameVersion
		modVersion
		splits
		speeds
		level {
			id
			xxHash
			publiclyVisible
			levelItems(
				first: 1
				filter: { deleted: { equalTo: false } }
				orderBy: [UPDATED_AT_DESC]
			) {
				nodes {
					name
					imageUrl
					authorId
					workshopId
					author {
						id
						steamId
						steamName
					}
				}
			}
			worldRecordGlobal {
				record {
					...ZC_GhostComparisonRecord
				}
			}
		}
		recordStatistic {
			...ZC_RecordStatistic
		}
		userPointContributions(first: 1) {
			nodes {
				contributionRank
				dateCalculated
				levelDecayedPoints
				levelPoints
				levelPosition
				playerDecayedPoints
			}
		}
	}
}
