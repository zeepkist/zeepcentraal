fragment ZC_DashboardLevel on Level {
	id
	xxHash
	adventure
	dateCreated
	levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
		nodes {
			name
			imageUrl
			fileUid
			fileAuthor
			workshopId
			validationTimeAuthor
			validationTimeGold
			validationTimeSilver
			validationTimeBronze
			author {
				steamId
				steamName
			}
		}
	}
	levelPoints {
		points
		rating
	}
	records(first: 0) {
		totalCount
	}
	personalBestGlobals(first: 0) {
		totalCount
	}
	votes(first: 0) {
		totalCount
	}
	viewerFavourites: favourites(first: 0, filter: { userId: { equalTo: $viewerId } })
		@include(if: $includeViewer)
	{
		totalCount
	}
	worldRecordGlobal {
		record {
			time
		}
		user {
			steamId
			steamName
		}
	}
}
query ZC_DashboardCritical(
	$daySince: Datetime!
	$now: Datetime!
	$viewerId: Int!
	$includeViewer: Boolean!
) {
	activeWeeklyTournament: trackTournaments(
		first: 1
		filter: {
			type: { equalTo: 0 }
			startAt: { lessThanOrEqualTo: $now }
			endAt: { greaterThan: $now }
			finalizedAt: { isNull: true }
		}
		orderBy: [START_AT_DESC, ID_DESC]
	) {
		nodes {
			...ZC_TrackTournamentFeature
		}
	}
	activeMonthlyTournament: trackTournaments(
		first: 1
		filter: {
			type: { equalTo: 1 }
			startAt: { lessThanOrEqualTo: $now }
			endAt: { greaterThan: $now }
			finalizedAt: { isNull: true }
		}
		orderBy: [START_AT_DESC, ID_DESC]
	) {
		nodes {
			...ZC_TrackTournamentFeature
		}
	}
	trendingLevels: hotLevelsSince(
		since: $daySince
		first: 6
		filter: {
			publiclyVisible: { equalTo: true }
			worldRecordGlobal: { record: { time: { greaterThan: 10 } } }
		}
	) {
		nodes {
			...ZC_DashboardLevel
			periodRecords: records(
				first: 0
				filter: { dateCreated: { greaterThanOrEqualTo: $daySince } }
			) {
				totalCount
			}
		}
	}
}
query ZC_DashboardHotLevels($since: Datetime!, $viewerId: Int!, $includeViewer: Boolean!) {
	levels: hotLevelsSince(
		since: $since
		first: 6
		filter: {
			publiclyVisible: { equalTo: true }
			worldRecordGlobal: { record: { time: { greaterThan: 10 } } }
		}
	) {
		nodes {
			...ZC_DashboardLevel
			periodRecords: records(
				first: 0
				filter: { dateCreated: { greaterThanOrEqualTo: $since } }
			) {
				totalCount
			}
		}
	}
}
fragment ZC_DashboardV6StatisticAggregates on RecordStatisticAggregates {
	sum {
		distance
		distanceInAir
		distanceOn1Wheel
		distanceOn2Wheels
		distanceOn3Wheels
		distanceOn4Wheels
		distanceOnGrass
		distanceOnGround
		distanceOnIce1
		distanceOnIce2
		distanceOnIce3
		distanceOnWood
		distanceOnMud
		distanceOnUnknown
		distanceOnSand
		distanceOnSoap
		distanceOnTarmac
		distanceRagdoll
		time
		timeInAir
		timeOnGrass
		timeOnGround
		timeOnIce1
		timeOnIce2
		timeOnIce3
		timeOnWood
		timeOnMud
		timeOnUnknown
		timeOnSand
		timeOnSoap
		timeOnTarmac
		timeRagdoll
		turnLeftCount
		turnRightCount
		armsUpCount
		brakeCount
		hornCount
	}
	average {
		averageGforce
		averageSpeed
	}
}
query ZC_DashboardStatistics($daySince: Datetime!, $monthSince: Datetime!) {
	allTimeStatistics: recordStatistics(first: 0) {
		aggregates {
			sum {
				distance
			}
		}
	}
	dayStatistics: recordStatistics(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $daySince } } }
	) {
		aggregates {
			sum {
				distance
			}
		}
	}
	monthStatistics: recordStatistics(
		first: 0
		filter: { record: { dateCreated: { greaterThanOrEqualTo: $monthSince } } }
	) {
		aggregates {
			sum {
				distance
			}
		}
	}
	v6DayStatistics: recordStatistics(
		first: 0
		filter: {
			ghostVersion: { greaterThanOrEqualTo: 6 }
			record: { dateCreated: { greaterThanOrEqualTo: $daySince } }
		}
	) {
		aggregates {
			...ZC_DashboardV6StatisticAggregates
		}
	}
	v6MonthStatistics: recordStatistics(
		first: 0
		filter: {
			ghostVersion: { greaterThanOrEqualTo: 6 }
			record: { dateCreated: { greaterThanOrEqualTo: $monthSince } }
		}
	) {
		aggregates {
			...ZC_DashboardV6StatisticAggregates
		}
	}
}
