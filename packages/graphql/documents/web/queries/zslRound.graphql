query ZC_ZslRoundBySeasonAndNumber($seasonId: Int!, $round: Int!) {
	zslRounds(first: 1, filter: { seasonId: { equalTo: $seasonId }, round: { equalTo: $round } }) {
		nodes {
			id
			round
			name
			eventDate
			seasonId
			season {
				name
			}
			zslLevels(first: 15, orderBy: [ID_ASC]) {
				nodes {
					id
					level {
						levelItems(
							first: 1
							filter: { deleted: { equalTo: false } }
							orderBy: [UPDATED_AT_DESC]
						) {
							nodes {
								name
								imageUrl
							}
						}
					}
				}
			}
		}
	}
}
