query ZC_UserTrackTournamentResults(
	$userId: Int!
	$type: Int!
	$now: Datetime!
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
) {
	trackTournaments(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: {
			type: { equalTo: $type }
			startAt: { lessThanOrEqualTo: $now }
			trackTournamentResults: { some: { userId: { equalTo: $userId } } }
		}
		orderBy: [START_AT_DESC, ID_DESC]
	) {
		edges {
			node {
				id
				type
				slug
				startAt
				endAt
				finalizedAt
				level {
					xxHash
					levelItems(
						first: 1
						filter: { deleted: { equalTo: false } }
						orderBy: [UPDATED_AT_DESC, ID_DESC]
					) {
						nodes {
							name
							imageUrl
							author {
								steamName
							}
						}
					}
				}
				trackTournamentResults(first: 1, filter: { userId: { equalTo: $userId } }) {
					nodes {
						userId
						rank
						points
						time
					}
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
	}
}
