query ZC_ZslLevel($id: Int!) {
	zslLevel(id: $id) {
		id
		roundId
		round {
			name
			round
			eventDate
			seasonId
			season {
				name
			}
		}
		zslLevelResults(first: 0) {
			aggregates {
				min {
					time
				}
			}
		}
		level {
			xxHash
			levelItems(
				first: 1
				filter: { deleted: { equalTo: false } }
				orderBy: [UPDATED_AT_DESC]
			) {
				nodes {
					name
					imageUrl
					workshopId
				}
			}
		}
	}
}
