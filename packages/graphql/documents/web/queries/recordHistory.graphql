query ZC_MyRecordCount($id: Int!) {
	records(first: 0, filter: { userId: { equalTo: $id } }) {
		totalCount
	}
}

fragment ZC_RecordHistoryRow on RecordHistoryEntry {
	id
	time
	dateCreated
	levelId
	userId
	userSteamId
	userName
	levelXxHash
	levelName
	levelPosition
	contributionRank
	levelPoints
	playerDecayedPoints
	levelDecayedPoints
	isPersonalBest
	isWorldRecord
	hasContribution
}

query ZC_RecordHistory(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: RecordHistoryEntryFilter
	$orderBy: [RecordHistoryEntriesOrderBy!]!
) {
	recordHistoryEntries(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			cursor
			node {
				...ZC_RecordHistoryRow
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
	}
}
