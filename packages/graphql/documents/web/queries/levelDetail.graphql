query ZC_LevelDetail($xxHash: String!, $now: Datetime!, $viewerId: Int!, $includeViewer: Boolean!) {
	levelByXxHash(xxHash: $xxHash) {
		id
		xxHash
		publiclyVisible
		adventure
		dateCreated
		levelItems(first: 1, filter: { deleted: { equalTo: false } }, orderBy: [UPDATED_AT_DESC]) {
			nodes {
				name
				imageUrl
				fileUid
				fileAuthor
				authorId
				workshopId
				validationTimeAuthor
				validationTimeGold
				validationTimeSilver
				validationTimeBronze
				author {
					id
					steamId
					steamName
				}
			}
		}
		levelPoints {
			points
			rating
			modifierLength
			modifierEvidence
			modifierQuality
			modifierRating
			complexityConfidence
			complexityScore
			fieldStrength
			qualityScore
			skillAlignment
			skillConfidence
			skillSampleSize
			skillScore
			skillSeparation
		}
		records(first: 0) {
			totalCount
		}
		personalBestGlobals(first: 0) {
			totalCount
		}
		votes(first: 0) {
			groupedAggregates(groupBy: VALUE) {
				keys
				sum {
					value
				}
			}
			totalCount
		}
		favourites(first: 0) {
			totalCount
		}
		viewerFavourites: favourites(first: 0, filter: { userId: { equalTo: $viewerId } })
			@include(if: $includeViewer)
		{
			totalCount
		}
		trackTournaments(
			first: 2
			filter: { startAt: { lessThanOrEqualTo: $now } }
			orderBy: [TYPE_ASC]
		) {
			nodes {
				...ZC_TrackTournamentFeature
			}
		}
		worldRecordGlobal {
			record {
				id
				time
				dateCreated
				levelId
				userId
				recordStatistic {
					distance
				}
			}
			user {
				id
				steamId
				steamName
			}
		}
	}
}
