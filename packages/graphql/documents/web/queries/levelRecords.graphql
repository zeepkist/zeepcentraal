query ZC_LevelRecords(
	$first: Int
	$after: Cursor
	$last: Int
	$before: Cursor
	$filter: RecordFilter!
	$orderBy: [RecordsOrderBy!]
	$includeStatus: Boolean!
) {
	records(
		first: $first
		after: $after
		last: $last
		before: $before
		filter: $filter
		orderBy: $orderBy
	) {
		edges {
			cursor
			node {
				id
				time
				dateCreated
				levelId
				userId
				user {
					steamId
					steamName
				}
				userPointContributions(first: 1) {
					nodes {
						levelPosition
						contributionRank
						levelPoints
						levelDecayedPoints
						playerDecayedPoints
					}
				}
				personalBestGlobals(first: 0) @include(if: $includeStatus) {
					totalCount
				}
				worldRecordGlobals(first: 0) @include(if: $includeStatus) {
					totalCount
				}
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
		totalCount
	}
}
