subscription ZC_RecordHistoryLive($filter: RecordHistoryEntryFilter) {
	recordHistoryEntries(first: 25, filter: $filter, orderBy: [DATE_CREATED_DESC, ID_DESC]) {
		edges {
			cursor
			node {
				...ZC_RecordHistoryRow
			}
		}
		pageInfo {
			startCursor
			endCursor
			hasNextPage
			hasPreviousPage
		}
	}
}
