[package]
name = "steam-client-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Steam client for Rust - Individual and Anonymous user account types"
license = "MIT"
repository = "https://github.com/lengoclongk59/steam-client-rs"
homepage = "https://github.com/lengoclongk59/steam-client-rs"
documentation = "https://docs.rs/steam-client-rs"
authors = ["lengoclongk59 <lengoclongk59@gmail.com>"]
readme = "README.md"
keywords = ["steam", "client", "websocket", "cm", "valve"]
categories = ["api-bindings", "network-programming", "games"]

[lib]
name = "steam_client"

[dependencies]
steamid = { package = "steamid-rs", version = "2.1.0" }
steam-enums = "0.1.0"
steam-protos = "0.1.0"
steam-crypto = { package = "steam-crypto-rs", version = "0.1.0" }
steam-auth = { package = "steam-auth-rs", version = "0.1.0" }
steam-totp = { package = "steam-totp-rs", version = "0.1.0" }
steam-cm-provider = "0.1.0"
steam-friend-code = "0.1.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip"] }
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
futures = "0.3"
async-trait = "0.1"
flate2 = "1.0"
lzma-rs = "0.3"
thiserror = "1.0"
tracing = "0.1"
rand = "0.9.2"
hex = "0.4"
byteorder = "1.5"
tokio-util = { version = "0.7", features = ["rt"] }
rayon = "1.11"
once_cell = "1.21"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"
parking_lot = "0.12"
rustc-hash = "2.1.2"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[features]
# Default feature set. `static-app-list` is intentionally *off* by default:
# the bundled AppList table is ~138k lines of generated code and only
# provides offline name lookups for apps that haven't been seen via PICS yet.
# Enable it explicitly if you need it.
default = []

# Bundle the auto-generated Steam AppID -> name table. Adds ~138k lines of
# `pub static APP_LIST: &[(u32, &str)]` to the compile, so it noticeably
# increases compile time and binary size. Without this feature,
# `SteamClient::get_app_name` falls back to the PICS cache only.
static-app-list = []

# Keep the patched dependency independently testable without making all of
# its upstream source part of this repository's formatting workspace.
[workspace]
