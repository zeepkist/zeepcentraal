[package]
name = "steam-auth-rs"
version = "0.1.2"
edition = "2021"
description = "Steam authentication and session management"
license = "MIT"
repository = "https://github.com/lengoclongk59/steam-auth-rs"
homepage = "https://github.com/lengoclongk59/steam-auth-rs"
documentation = "https://docs.rs/steam-auth-rs"
authors = ["lengoclongk59 <lengoclongk59@gmail.com>"]
readme = "README.md"
keywords = ["steam", "auth", "authentication", "steam-guard"]
categories = ["api-bindings", "authentication", "games"]

[lib]
name = "steam_auth"

[dependencies]
steamid = { package = "steamid-rs", version = "2.1.0" }
steam-enums = "0.1.0"
steam-protos = "0.1.0"
steam-crypto = { package = "steam-crypto-rs", version = "0.1.0" }
steam-cm-provider = "0.1.0"
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "1.0"
tracing = "0.1"
prost = "0.12"
rsa = "0.9"
num-bigint-dig = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1.0"
rand = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2.5"
regex = "1.10"
hostname = "0.4"
hex = "0.4.3"
async-trait = "0.1"
urlencoding = "2.1"

[dev-dependencies]
steam-totp = { package = "steam-totp-rs", version = "0.1.0" }
tracing-subscriber = "0.3"

# Upstream formatting is separate from the application workspace.
[workspace]

[patch.crates-io]
steam-cm-provider = { path = "../steam-cm-provider" }
