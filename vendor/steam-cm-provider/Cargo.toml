[package]
name = "steam-cm-provider"
version = "0.1.2"
edition = "2021"
description = "Steam Connection Manager (CM) WebSocket discovery library with disk caching, latency-aware verification, and pluggable HTTP clients."
license = "MIT"
repository = "https://github.com/lengoclongk59/steam-cm-provider"
homepage = "https://github.com/lengoclongk59/steam-cm-provider"
documentation = "https://docs.rs/steam-cm-provider"
authors = ["lengoclongk59 <lengoclongk59@gmail.com>"]
readme = "README.md"
keywords = ["steam", "websocket", "discovery"]
categories = ["api-bindings", "network-programming", "games"]

[dependencies]
tokio = { version = "1.48.0", features = ["full", "tracing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Enforce patched webpki even when the Steam client is resolved outside this workspace.
rustls = { version = "0.23.45", default-features = false }
rand = "0.9.2"
home = "0.5"
fd-lock = "4.0"

# Upstream formatting is separate from the application workspace.
[workspace]
