name: Build Package Binary
description: Build one package binary and upload it as a workflow artifact.
inputs:
  name:
    description: Package/image name used for artifact naming.
    required: true
  build-script:
    description: Root package.json build script to run.
    required: true
  binary:
    description: Binary filename expected under dist/.
    required: true
runs:
  using: composite
  steps:
    - name: Setup Bun dependencies
      uses: ./.github/actions/setup-bun-deps

    - name: Cache Nuxt build data
      if: ${{ inputs.name == 'web' }}
      uses: actions/cache@v6
      with:
        path: |
          packages/web/.data
          packages/web/node_modules/.cache/nuxt
          packages/web/node_modules/.cache/vite
        key: ${{ runner.os }}-${{ runner.arch }}-nuxt-${{ hashFiles('bun.lock', 'package.json', 'packages/web/package.json', 'packages/web/nuxt.config.ts') }}-${{ hashFiles('packages/web/app/**', 'packages/web/content/**', 'packages/web/i18n/**', 'packages/web/public/**', 'packages/web/server/**', 'packages/core/src/**', 'packages/database/src/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuxt-${{ hashFiles('bun.lock', 'package.json', 'packages/web/package.json', 'packages/web/nuxt.config.ts') }}-

    - name: Build ${{ inputs.name }} binary
      shell: bash
      run: bun run ${{ inputs.build-script }}

    - name: Upload ${{ inputs.name }} binary
      uses: actions/upload-artifact@v7
      with:
        name: compiled-binary-${{ inputs.name }}
        if-no-files-found: error
        path: dist/${{ inputs.binary }}
