name: Build Docker Image
description: Optionally download one package output and build or publish one Docker image.
inputs:
  name:
    description: Image/package name used for artifact naming.
    required: true
  dockerfile:
    description: Dockerfile path.
    required: true
  artifact-download-path:
    description: Directory where package output should be downloaded.
    required: true
  expected-path:
    description: File expected after package output download.
    required: true
  download-artifact:
    description: Whether to download the package output workflow artifact.
    required: false
    default: 'true'
  clone-super-league:
    description: Clone Super League data into Docker build context.
    required: false
    default: 'false'
  service-version:
    description: SERVICE_VERSION build arg value.
    required: true
  push:
    description: Whether docker/build-push-action should push.
    required: false
    default: 'false'
  tags:
    description: Docker image tags.
    required: true
  cache-write:
    description: Whether to export the image cache to GitHub Actions.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download ${{ inputs.name }} output
      if: ${{ inputs.download-artifact == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: package-output-${{ inputs.name }}
        path: ${{ inputs.artifact-download-path }}

    - name: Verify ${{ inputs.name }} output
      shell: bash
      env:
        EXPECTED_PATH: ${{ inputs.expected-path }}
      run: test -f "$EXPECTED_PATH"

    - name: Clone Super League Data
      if: ${{ inputs.clone-super-league == 'true' }}
      shell: bash
      run: git clone --depth 1 --branch data https://github.com/zeepkist/super-league.git super_league_data

    - name: Build ${{ inputs.name }} image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        build-args: |
          SERVICE_VERSION=${{ inputs.service-version }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: ${{ inputs.cache-write == 'true' && format('type=gha,mode=max,scope={0},ignore-error=true', inputs.name) || '' }}
