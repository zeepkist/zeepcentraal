name: Setup Bun Dependencies
description: Setup pinned Bun, restore an exact node_modules cache, and install on cache miss
runs:
  using: composite
  steps:
    - name: Set up Bun
      id: bun_setup
      uses: oven-sh/setup-bun@v2

    - name: Cache Bun node_modules
      id: bun-node-modules-cache
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun_setup.outputs.bun-version }}-node-modules-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}

    - name: Install dependencies
      if: steps.bun-node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
