name: Pull Request Validation

on:
  # Renovate waits for branch checks before opening PRs (prCreation: not-pending).
  push:
    branches: ['renovate/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [develop]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub cancels sibling jobs only within a fail-fast matrix.
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        name: [rust-quality, ts-quality, release-tooling]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/zc-target
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
      - if: ${{ matrix.name == 'rust-quality' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - if: ${{ matrix.name == 'rust-quality' }}
        uses: ./.github/actions/setup-rust-cache
        id: kache
        with:
          scope: quality
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo fmt --all --check
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo test --locked --workspace
      - if: ${{ matrix.name == 'rust-quality' }}
        uses: ./.github/actions/setup-bun-deps
      - if: ${{ matrix.name == 'rust-quality' }}
        uses: ./.github/actions/verify-telemetry
      # The standalone vendor lockfile can resolve versions absent from the workspace cache.
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo fetch --manifest-path vendor/steam-client-rs/Cargo.toml --locked
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo clippy --manifest-path vendor/steam-client-rs/Cargo.toml --frozen --all-targets -- -D warnings
      - if: ${{ matrix.name == 'rust-quality' }}
        run: cargo test --manifest-path vendor/steam-client-rs/Cargo.toml --frozen --lib ticket_request
      - if: ${{ matrix.name == 'ts-quality' }}
        uses: ./.github/actions/setup-bun-deps
      - if: ${{ matrix.name == 'ts-quality' }}
        name: Typecheck PostGraphile
        run: bunx --no-install golar -p packages/postgraphile/tsconfig.json
      - if: ${{ matrix.name == 'ts-quality' }}
        name: Typecheck web
        run: bun run typecheck:web
      - if: ${{ matrix.name == 'ts-quality' }}
        name: Test PostGraphile
        run: bun --no-env-file test --isolate packages/telemetry/src packages/postgraphile/src packages/database/src/telemetry.spec.ts
      - if: ${{ matrix.name == 'ts-quality' }}
        name: Test web
        run: bun --bun run test:web
      - if: ${{ matrix.name == 'ts-quality' }}
        name: Lint and format retained TypeScript services
        run: bunx --no-install biome check packages/postgraphile packages/web packages/telemetry packages/database/src/telemetry.ts
      - if: ${{ matrix.name == 'release-tooling' }}
        uses: ./.github/actions/setup-bun-deps
      - if: ${{ matrix.name == 'release-tooling' }}
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - if: ${{ matrix.name == 'release-tooling' }}
        run: node --test scripts/release/release.test.mjs

  binaries:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: rust-binaries, runner: ubuntu-22.04 }
          - { name: 'ts-binaries (postgraphile)', runner: ubuntu-latest, package: postgraphile, script: 'build:postgraphile', path: 'dist/zeepcentraal-postgraphile', hidden: false }
          - { name: 'ts-binaries (web)', runner: ubuntu-latest, package: web, script: 'build:web', path: 'packages/web/.output/', hidden: true }
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/zc-target
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
      - if: ${{ matrix.name == 'rust-binaries' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - if: ${{ matrix.name == 'rust-binaries' }}
        uses: ./.github/actions/setup-rust-cache
        id: kache
        with:
          scope: release-glibc-2.35
      - if: ${{ matrix.name == 'rust-binaries' }}
        name: Verify Rust build glibc baseline
        run: test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
      - if: ${{ matrix.name == 'rust-binaries' }}
        name: Build Rust service binaries
        run: cargo build --locked --release -p zc-server -p zc-jobs -p zc-migrate -p zc-lobby-host -p zc-discord -p zc-streamkist -p zc-inspector-zeep -p zc-import-zsl --bins
      - if: ${{ matrix.name == 'rust-binaries' }}
        name: Stage Rust binaries
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR"/release/zeepcentraal-{server,jobs,migrate,lobby-host,discord,streamkist,inspector-zeep,import-zsl} dist/
      - if: ${{ matrix.name == 'rust-binaries' }}
        name: Check Rust runtime ABI
        run: node scripts/release/check-rust-abi.mjs dist/zeepcentraal-{server,jobs,migrate,lobby-host,discord,streamkist,inspector-zeep,import-zsl}
      - if: ${{ matrix.name == 'rust-binaries' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          if-no-files-found: error
          path: dist/zeepcentraal-*
      - if: ${{ matrix.name != 'rust-binaries' }}
        uses: ./.github/actions/build-package-output
        with:
          name: ${{ matrix.package }}
          build-script: ${{ matrix.script }}
          artifact-path: ${{ matrix.path }}
          include-hidden-files: ${{ matrix.hidden }}

  build-images:
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: zc-server, file: docker/Dockerfile.server, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-server, super_league: false }
          - { name: zc-jobs, file: docker/Dockerfile.jobs, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-jobs, super_league: false }
          - { name: zc-migrate, file: docker/Dockerfile.migrate, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-migrate, super_league: false }
          - { name: zc-lobby-host, file: docker/Dockerfile.lobby-host, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-lobby-host, super_league: false }
          - { name: zc-discord, file: docker/Dockerfile.discord, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-discord, super_league: false }
          - { name: zc-streamkist, file: docker/Dockerfile.streamkist, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-streamkist, super_league: false }
          - { name: zc-inspector-zeep, file: docker/Dockerfile.inspector-zeep, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-inspector-zeep, super_league: false }
          - { name: zc-import-zsl, file: docker/Dockerfile.zsl, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-import-zsl, super_league: true }
          - { name: postgraphile, file: docker/Dockerfile.postgraphile, artifact: package-output-postgraphile, path: dist, expected: dist/zeepcentraal-postgraphile, super_league: false }
          - { name: web, file: docker/Dockerfile.web, artifact: package-output-web, path: packages/web/.output, expected: packages/web/.output/server/index.mjs, super_league: false }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.file }}
          artifact-download-path: ${{ matrix.path }}
          expected-path: ${{ matrix.expected }}
          clone-super-league: ${{ matrix.super_league }}
          service-version: pr-${{ github.event.pull_request.number || github.run_id }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:pr-${{ github.event.pull_request.number || github.run_id }}

  can-merge:
    name: can-merge
    runs-on: ubuntu-latest
    needs: [quality, binaries, build-images]
    if: ${{ always() }}
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success'
