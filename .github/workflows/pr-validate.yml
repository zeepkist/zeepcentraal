name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [develop]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format

  build-packages:
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: true
      matrix:
        package:
          - name: server
            build_script: build:server
            binary: zeepcentraal-server
          - name: jobs
            build_script: build:jobs
            binary: zeepcentraal-jobs
          - name: migrate
            build_script: build:migrate
            binary: zeepcentraal-migrate
          - name: import-zsl
            build_script: build:import-zsl
            binary: zeepcentraal-import-zsl
          - name: postgraphile
            build_script: build:postgraphile
            binary: zeepcentraal-postgraphile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Build ${{ matrix.package.name }} binary
        run: bun run ${{ matrix.package.build_script }}

      - name: Upload ${{ matrix.package.name }} binary
        uses: actions/upload-artifact@v7
        with:
          name: compiled-binary-${{ matrix.package.name }}
          if-no-files-found: error
          path: dist/${{ matrix.package.binary }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-packages]
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: server
            file: Dockerfile.server
            binary: zeepcentraal-server
            tag: zeepcentraal/server
            clone_super_league: false
          - name: jobs
            file: Dockerfile.jobs
            binary: zeepcentraal-jobs
            tag: zeepcentraal/jobs
            clone_super_league: false
          - name: migrate
            file: Dockerfile.migrate
            binary: zeepcentraal-migrate
            tag: zeepcentraal/migrate
            clone_super_league: false
          - name: import-zsl
            file: Dockerfile.zsl
            binary: zeepcentraal-import-zsl
            tag: zeepcentraal/import-zsl
            clone_super_league: true
          - name: postgraphile
            file: Dockerfile.postgraphile
            binary: zeepcentraal-postgraphile
            tag: zeepcentraal/postgraphile
            clone_super_league: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download ${{ matrix.image.name }} binary
        uses: actions/download-artifact@v8
        with:
          name: compiled-binary-${{ matrix.image.name }}
          path: dist

      - name: Verify ${{ matrix.image.name }} binary
        run: test -f dist/${{ matrix.image.binary }}

      - name: Clone Super League Data
        if: ${{ matrix.image.clone_super_league }}
        run: |
          git clone --depth 1 --branch data https://github.com/zeepkist/super-league.git super_league_data

      - name: Build ${{ matrix.image.name }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          build-args: |
            SERVICE_VERSION=pr-${{ github.event.pull_request.number || github.run_id }}
          tags: ${{ matrix.image.tag }}:pr-${{ github.event.pull_request.number || github.run_id }}
