name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [develop]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/zc-target
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  ts-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-deps
      - name: Typecheck PostGraphile
        run: bunx --no-install golar -p packages/postgraphile/tsconfig.json
      - name: Typecheck web
        run: bun run typecheck:web
      - name: Test PostGraphile
        run: bun --no-env-file test --isolate packages/postgraphile/src
      - name: Test web
        run: bun --bun run test:web
      - name: Lint and format retained TypeScript services
        run: bunx --no-install biome check packages/postgraphile packages/web

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node --test scripts/release/release.test.mjs

  rust-binaries:
    needs: rust-quality
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/zc-target
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: 'glibc-2.35'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Verify Rust build glibc baseline
        run: test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
      - name: Build Rust service binaries
        run: cargo build --locked --release -p zc-server -p zc-jobs -p zc-migrate -p zc-lobby-host -p zc-discord -p zc-inspector-zeep -p zc-import-zsl --bins
      - name: Stage Rust binaries
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR"/release/zeepcentraal-{server,jobs,migrate,lobby-host,discord,inspector-zeep,import-zsl} dist/
      - name: Check Rust runtime ABI
        run: node scripts/release/check-rust-abi.mjs dist/zeepcentraal-{server,jobs,migrate,lobby-host,discord,inspector-zeep,import-zsl}
      - uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          if-no-files-found: error
          path: dist/zeepcentraal-*

  ts-binaries:
    needs: ts-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { name: postgraphile, script: 'build:postgraphile', path: 'dist/zeepcentraal-postgraphile', hidden: false }
          - { name: web, script: 'build:web', path: 'packages/web/.output/', hidden: true }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-package-output
        with:
          name: ${{ matrix.package.name }}
          build-script: ${{ matrix.package.script }}
          artifact-path: ${{ matrix.package.path }}
          include-hidden-files: ${{ matrix.package.hidden }}

  build-images:
    needs: [rust-binaries, ts-binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: zc-server, file: Dockerfile.server, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-server, super_league: false }
          - { name: zc-jobs, file: Dockerfile.jobs, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-jobs, super_league: false }
          - { name: zc-migrate, file: Dockerfile.migrate, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-migrate, super_league: false }
          - { name: zc-lobby-host, file: Dockerfile.lobby-host, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-lobby-host, super_league: false }
          - { name: zc-discord, file: Dockerfile.discord, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-discord, super_league: false }
          - { name: zc-inspector-zeep, file: packages/inspector-zeep/Dockerfile, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-inspector-zeep, super_league: false }
          - { name: zc-import-zsl, file: Dockerfile.zsl, artifact: rust-binaries, path: dist, expected: dist/zeepcentraal-import-zsl, super_league: true }
          - { name: postgraphile, file: Dockerfile.postgraphile, artifact: package-output-postgraphile, path: dist, expected: dist/zeepcentraal-postgraphile, super_league: false }
          - { name: web, file: Dockerfile.web, artifact: package-output-web, path: packages/web/.output, expected: packages/web/.output/server/index.mjs, super_league: false }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.file }}
          artifact-download-path: ${{ matrix.path }}
          expected-path: ${{ matrix.expected }}
          clone-super-league: ${{ matrix.super_league }}
          service-version: pr-${{ github.event.pull_request.number || github.run_id }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:pr-${{ github.event.pull_request.number || github.run_id }}

  can-merge:
    name: can-merge
    runs-on: ubuntu-latest
    needs: [rust-quality, ts-quality, release-tooling, rust-binaries, ts-binaries, build-images]
    if: ${{ always() }}
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success success success success'
