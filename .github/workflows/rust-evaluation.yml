name: Rust migration evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'tools/rust-evaluation/**'
      - 'packages/database/drizzle/**'
      - 'packages/discord/**'
      - 'packages/graphql/documents/discord/**'
      - '.github/workflows/rust-evaluation.yml'
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlx, diesel]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: zc_preview
          POSTGRES_PASSWORD: local-preview-only
          POSTGRES_DB: zc_rust_${{ matrix.adapter }}
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U zc_preview"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      ZC_PREVIEW_DATABASE_URL: postgres://zc_preview:local-preview-only@127.0.0.1:54329/zc_rust_${{ matrix.adapter }}
      ZC_PREVIEW_PORT: '4310'
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all --check
      - name: Benchmark accounting tests
        if: matrix.adapter == 'sqlx'
        run: python3 -m unittest discover -s tools/rust-evaluation/benchmark -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features db-${{ matrix.adapter }} -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace --no-default-features --features db-${{ matrix.adapter }}
      - name: Exclusive dependency graph
        run: python3 tools/rust-evaluation/check-dependencies.py ${{ matrix.adapter }}
      - name: Database contract
        run: cargo test --locked -p zc-database --no-default-features --features db-${{ matrix.adapter }} --test preview -- --ignored
      - name: Release binaries
        run: cargo build --locked --release -p zc-server -p zc-migrate --no-default-features --features db-${{ matrix.adapter }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Binary compatibility fixtures
        run: bun tools/rust-evaluation/binary-fixtures.ts --check
      - name: Preview smoke
        shell: bash
        run: |
          set -euo pipefail
          target/release/zc-server > /tmp/zc-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4310/healthz > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/zc-preview.log; exit 1; fi
          bun tools/rust-evaluation/smoke.ts http://127.0.0.1:4310
      - name: Upload evaluation binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-evaluation-${{ matrix.adapter }}
          path: |
            target/release/zc-server
            target/release/zc-migrate

  discord-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Existing lockfile dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Discord payload and document drift
        run: |
          bun --no-env-file tools/rust-evaluation/discord/golden.ts --check
          bun --no-env-file tools/rust-evaluation/discord/documents.ts --check
          bun x --no-install tsc -p tools/rust-evaluation/discord/tsconfig.json
      - name: Serenity evaluation contracts
        run: |
          cargo test --locked -p zc-discord-evaluation
          cargo clippy --locked -p zc-discord-evaluation --all-targets -- -D warnings
          cargo build --locked --release -p zc-discord-evaluation
