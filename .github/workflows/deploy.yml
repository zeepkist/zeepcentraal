name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/zc-target
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  ts-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-deps
      - run: bunx --no-install golar -p packages/postgraphile/tsconfig.json
      - run: bun run typecheck:web
      - run: bun --no-env-file test --isolate packages/postgraphile/src
      - run: bun --bun run test:web
      - run: bunx --no-install biome check packages/postgraphile packages/web

  release-plan:
    needs: [rust-quality, ts-quality]
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-bun-deps
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node --test scripts/release/release.test.mjs
      - name: Plan independent releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/plan.mjs "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

  rust-binaries:
    needs: release-plan
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/zc-target
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Stamp release crate versions in build checkout
        run: node scripts/release/stamp.mjs "$RUNNER_TEMP/release-plan.json"
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Build Rust service binaries
        run: cargo build --locked --release -p zc-server -p zc-jobs -p zc-migrate -p zc-lobby-host -p zc-discord -p zc-inspector-zeep -p zc-import-zsl --bins
      - name: Stage Rust binaries
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR"/release/zeepcentraal-{server,jobs,migrate,lobby-host,discord,inspector-zeep,import-zsl} dist/
      - uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          path: dist/zeepcentraal-*
          if-no-files-found: error

  ts-binaries:
    needs: ts-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { name: postgraphile, script: 'build:postgraphile', path: 'dist/zeepcentraal-postgraphile', hidden: false }
          - { name: web, script: 'build:web', path: 'packages/web/.output/', hidden: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-package-output
        with:
          name: ${{ matrix.package.name }}
          build-script: ${{ matrix.package.script }}
          artifact-path: ${{ matrix.package.path }}
          include-hidden-files: ${{ matrix.package.hidden }}

  preflight-images:
    needs: [release-plan, rust-binaries, ts-binaries]
    if: ${{ needs.release-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.dockerfile }}
          artifact-download-path: ${{ matrix.downloadPath }}
          expected-path: ${{ matrix.expectedPath }}
          clone-super-league: ${{ matrix.cloneSuperLeague }}
          service-version: ${{ matrix.version }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}
          cache-write: true

  publish-release:
    needs: [release-plan, preflight-images]
    if: ${{ needs.release-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - uses: ./.github/actions/setup-bun-deps
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Configure release identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Publish semantic tags and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs "$RUNNER_TEMP/release-plan.json"

  publish-images:
    needs: [release-plan, publish-release]
    if: ${{ needs.release-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Image tags
        id: tags
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:latest"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$GITHUB_SHA"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$MAJOR"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$MINOR"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.dockerfile }}
          artifact-download-path: ${{ matrix.downloadPath }}
          expected-path: ${{ matrix.expectedPath }}
          clone-super-league: ${{ matrix.cloneSuperLeague }}
          service-version: ${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-write: true
