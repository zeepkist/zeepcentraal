name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  rust-quality:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.rust_packages != '' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/zc-target
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: ./.github/actions/setup-rust-cache
        id: kache
        with:
          scope: quality
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: ./.github/actions/setup-bun-deps
      - uses: ./.github/actions/verify-telemetry
      # The standalone vendor lockfile can resolve versions absent from the workspace cache.
      - run: cargo fetch --manifest-path vendor/steam-client-rs/Cargo.toml --locked
      - run: cargo clippy --manifest-path vendor/steam-client-rs/Cargo.toml --frozen --all-targets -- -D warnings
      - run: cargo test --manifest-path vendor/steam-client-rs/Cargo.toml --frozen --lib ticket_request

      - name: Enforce compiler cache budget
        id: cache-budget
        continue-on-error: true
        if: ${{ success() && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          # Export only the bounded store namespace, even while target files retain blobs.
          KACHE_GC_EVICT_SHARED: '1'
        run: node scripts/release/cache-budget.mjs
      - name: Save successful compiler cache
        if: ${{ success() && steps.cache-budget.outcome == 'success' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.kache.outputs.path }}
          key: ${{ steps.kache.outputs.key }}

  ts-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-deps
      - run: bunx --no-install golar -p packages/postgraphile/tsconfig.json
      - run: bun run typecheck:web
      - run: bun --no-env-file test --isolate packages/telemetry/src packages/postgraphile/src packages/database/src/telemetry.spec.ts
      - run: bun --bun run test:web
      - run: bunx --no-install biome check packages/postgraphile packages/web packages/telemetry packages/database/src/telemetry.ts

  release-plan:
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      count: ${{ steps.plan.outputs.count }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      rust_binaries: ${{ steps.plan.outputs.rust_binaries }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-bun-deps
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node --test scripts/release/release.test.mjs
      - name: Plan independent releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/plan.mjs "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

  rust-binaries:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.rust_packages != '' }}
    # SteamCMD runtime is Ubuntu 22.04 (glibc 2.35); all shipped Rust binaries need that ABI.
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/zc-target
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: ./.github/actions/setup-rust-cache
        id: kache
        with:
          scope: release-glibc-2.35
      - name: Verify Rust build glibc baseline
        run: test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
      - name: Stamp release crate versions in build checkout
        run: node scripts/release/stamp.mjs "$RUNNER_TEMP/release-plan.json"
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Build Rust service binaries
        env:
          RUST_PACKAGES: ${{ needs.release-plan.outputs.rust_packages }}
        run: |
          read -r -a packages <<< "$RUST_PACKAGES"
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          cargo build --locked --release "${args[@]}" --bins
      - name: Stage Rust binaries
        env:
          RUST_BINARIES: ${{ needs.release-plan.outputs.rust_binaries }}
        run: |
          read -r -a binaries <<< "$RUST_BINARIES"
          mkdir -p dist
          for binary in "${binaries[@]}"; do
            cp "$CARGO_TARGET_DIR/release/$binary" dist/
          done
      - name: Check Rust runtime ABI
        run: node scripts/release/check-rust-abi.mjs dist/zeepcentraal-*
      - uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          path: dist/zeepcentraal-*
          if-no-files-found: error

      - name: Enforce compiler cache budget
        id: cache-budget
        continue-on-error: true
        if: ${{ success() && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          # Export only the bounded store namespace, even while target files retain blobs.
          KACHE_GC_EVICT_SHARED: '1'
        run: node scripts/release/cache-budget.mjs
      - name: Save successful compiler cache
        if: ${{ success() && steps.cache-budget.outcome == 'success' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.kache.outputs.path }}
          key: ${{ steps.kache.outputs.key }}

  ts-binaries:
    needs: ts-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { name: postgraphile, script: 'build:postgraphile', path: 'dist/zeepcentraal-postgraphile', hidden: false }
          - { name: web, script: 'build:web', path: 'packages/web/.output/', hidden: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-package-output
        with:
          name: ${{ matrix.package.name }}
          build-script: ${{ matrix.package.script }}
          artifact-path: ${{ matrix.package.path }}
          include-hidden-files: ${{ matrix.package.hidden }}

  preflight-images:
    needs: [release-plan, rust-quality, rust-binaries, ts-binaries]
    if: >-
      ${{ !cancelled() &&
          needs.release-plan.result == 'success' &&
          needs.release-plan.outputs.count != '0' &&
          needs.ts-binaries.result == 'success' &&
          (needs.release-plan.outputs.rust_packages == '' ||
           (needs.rust-quality.result == 'success' && needs.rust-binaries.result == 'success')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.dockerfile }}
          artifact-download-path: ${{ matrix.downloadPath }}
          expected-path: ${{ matrix.expectedPath }}
          clone-super-league: ${{ matrix.cloneSuperLeague }}
          service-version: ${{ matrix.version }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}
          cache-write: true

  publish-release:
    needs: [release-plan, preflight-images]
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.preflight-images.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}
      - uses: ./.github/actions/setup-bun-deps
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Configure release identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Publish semantic tags and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs "$RUNNER_TEMP/release-plan.json"

  publish-images:
    needs: [release-plan, publish-release]
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Image tags
        id: tags
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:latest"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$GITHUB_SHA"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$MAJOR"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$MINOR"
            echo "ghcr.io/$GITHUB_REPOSITORY/$NAME:$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.name }}
          artifact-name: ${{ matrix.artifact }}
          dockerfile: ${{ matrix.dockerfile }}
          artifact-download-path: ${{ matrix.downloadPath }}
          expected-path: ${{ matrix.expectedPath }}
          clone-super-league: ${{ matrix.cloneSuperLeague }}
          service-version: ${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-write: true
