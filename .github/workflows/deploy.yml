name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  release:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release):'))
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - database
          - server
          - jobs
          - import-zsl
          - postgraphile
          - telemetry
          - workshop
          - web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Configure git user
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run per-package semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:${{ matrix.package }}

  build-packages:
    runs-on: ubuntu-latest
    needs: [test, release]
    if: always() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: server
            build_script: build:server
            binary: zeepcentraal-server
          - name: jobs
            build_script: build:jobs
            binary: zeepcentraal-jobs
          - name: migrate
            build_script: build:migrate
            binary: zeepcentraal-migrate
          - name: import-zsl
            build_script: build:import-zsl
            binary: zeepcentraal-import-zsl
          - name: postgraphile
            build_script: build:postgraphile
            binary: zeepcentraal-postgraphile
          - name: web
            build_script: build:web
            binary: zeepcentraal-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Build ${{ matrix.package.name }} binary
        uses: ./.github/actions/build-package-binary
        with:
          name: ${{ matrix.package.name }}
          build-script: ${{ matrix.package.build_script }}
          binary: ${{ matrix.package.binary }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-packages]
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: server
            file: Dockerfile.server
            binary: zeepcentraal-server
            image_name: server
            release_tag_prefix: server
            clone_super_league: false
          - name: jobs
            file: Dockerfile.jobs
            binary: zeepcentraal-jobs
            image_name: jobs
            release_tag_prefix: jobs
            clone_super_league: false
          - name: migrate
            file: Dockerfile.migrate
            binary: zeepcentraal-migrate
            image_name: migrate
            release_tag_prefix: database
            clone_super_league: false
          - name: import-zsl
            file: Dockerfile.zsl
            binary: zeepcentraal-import-zsl
            image_name: import-zsl
            release_tag_prefix: import-zsl
            clone_super_league: true
          - name: postgraphile
            file: Dockerfile.postgraphile
            binary: zeepcentraal-postgraphile
            image_name: postgraphile
            release_tag_prefix: postgraphile
            clone_super_league: false
          - name: web
            file: Dockerfile.web
            binary: zeepcentraal-web
            image_name: web
            release_tag_prefix: web
            clone_super_league: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve ${{ matrix.image.name }} image version
        id: image_version
        uses: ./.github/actions/resolve-image-version
        with:
          release-tag-prefix: ${{ matrix.image.release_tag_prefix }}

      - name: Build ${{ matrix.image.name }} image (no push)
        uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.image.name }}
          dockerfile: ${{ matrix.image.file }}
          binary: ${{ matrix.image.binary }}
          clone-super-league: ${{ matrix.image.clone_super_league }}
          service-version: ${{ steps.image_version.outputs.version }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ github.sha }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: server
            file: Dockerfile.server
            binary: zeepcentraal-server
            image_name: server
            release_tag_prefix: server
            clone_super_league: false
          - name: jobs
            file: Dockerfile.jobs
            binary: zeepcentraal-jobs
            image_name: jobs
            release_tag_prefix: jobs
            clone_super_league: false
          - name: migrate
            file: Dockerfile.migrate
            binary: zeepcentraal-migrate
            image_name: migrate
            release_tag_prefix: database
            clone_super_league: false
          - name: import-zsl
            file: Dockerfile.zsl
            binary: zeepcentraal-import-zsl
            image_name: import-zsl
            release_tag_prefix: import-zsl
            clone_super_league: true
          - name: postgraphile
            file: Dockerfile.postgraphile
            binary: zeepcentraal-postgraphile
            image_name: postgraphile
            release_tag_prefix: postgraphile
            clone_super_league: false
          - name: web
            file: Dockerfile.web
            binary: zeepcentraal-web
            image_name: web
            release_tag_prefix: web
            clone_super_league: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve ${{ matrix.image.name }} image version tags
        id: image_version
        uses: ./.github/actions/resolve-image-version
        with:
          release-tag-prefix: ${{ matrix.image.release_tag_prefix }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.image.name }} image
        uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.image.name }}
          dockerfile: ${{ matrix.image.file }}
          binary: ${{ matrix.image.binary }}
          clone-super-league: ${{ matrix.image.clone_super_league }}
          service-version: ${{ steps.image_version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ steps.image_version.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ steps.image_version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ steps.image_version.outputs.version }}
