name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        run: bun --bun run typecheck

      - name: Run tests
        run: bun --bun run test

  release:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      major: ${{ steps.release_version.outputs.major }}
      major_minor: ${{ steps.release_version.outputs.major_minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Setup release Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Configure git user
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Check release history
        id: release_history
        shell: bash
        run: |
          git fetch --force --tags origin
          TAG="$(git tag -l --merged "$GITHUB_SHA" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$TAG" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release history found.
          fi

      - name: Run semantic release
        if: steps.release_history.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          git fetch --force --tags origin
          VERSION="$(git tag -l --points-at "$GITHUB_SHA" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "major=" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"

  build-packages:
    runs-on: ubuntu-latest
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: server
            build_script: build:server
            binary: zeepcentraal-server
          - name: jobs
            build_script: build:jobs
            binary: zeepcentraal-jobs
          - name: migrate
            build_script: build:migrate
            binary: zeepcentraal-migrate
          - name: import-zsl
            build_script: build:import-zsl
            binary: zeepcentraal-import-zsl
          - name: postgraphile
            build_script: build:postgraphile
            binary: zeepcentraal-postgraphile
          - name: web
            build_script: build:web
            binary: zeepcentraal-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Build ${{ matrix.package.name }} binary
        uses: ./.github/actions/build-package-binary
        with:
          name: ${{ matrix.package.name }}
          build-script: ${{ matrix.package.build_script }}
          binary: ${{ matrix.package.binary }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-packages, release]
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: server
            file: Dockerfile.server
            binary: zeepcentraal-server
            image_name: server
            clone_super_league: false
          - name: jobs
            file: Dockerfile.jobs
            binary: zeepcentraal-jobs
            image_name: jobs
            clone_super_league: false
          - name: migrate
            file: Dockerfile.migrate
            binary: zeepcentraal-migrate
            image_name: migrate
            clone_super_league: false
          - name: import-zsl
            file: Dockerfile.zsl
            binary: zeepcentraal-import-zsl
            image_name: import-zsl
            clone_super_league: true
          - name: postgraphile
            file: Dockerfile.postgraphile
            binary: zeepcentraal-postgraphile
            image_name: postgraphile
            clone_super_league: false
          - name: web
            file: Dockerfile.web
            binary: zeepcentraal-web
            image_name: web
            clone_super_league: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Build ${{ matrix.image.name }} image (no push)
        uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.image.name }}
          dockerfile: ${{ matrix.image.file }}
          binary: ${{ matrix.image.binary }}
          clone-super-league: ${{ matrix.image.clone_super_league }}
          service-version: ${{ needs.release.outputs.version || github.sha }}
          push: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ github.sha }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: [docker-build, release]
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: server
            file: Dockerfile.server
            binary: zeepcentraal-server
            image_name: server
            clone_super_league: false
          - name: jobs
            file: Dockerfile.jobs
            binary: zeepcentraal-jobs
            image_name: jobs
            clone_super_league: false
          - name: migrate
            file: Dockerfile.migrate
            binary: zeepcentraal-migrate
            image_name: migrate
            clone_super_league: false
          - name: import-zsl
            file: Dockerfile.zsl
            binary: zeepcentraal-import-zsl
            image_name: import-zsl
            clone_super_league: true
          - name: postgraphile
            file: Dockerfile.postgraphile
            binary: zeepcentraal-postgraphile
            image_name: postgraphile
            clone_super_league: false
          - name: web
            file: Dockerfile.web
            binary: zeepcentraal-web
            image_name: web
            clone_super_league: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.image.name }} image
        uses: ./.github/actions/build-docker-image
        with:
          name: ${{ matrix.image.name }}
          dockerfile: ${{ matrix.image.file }}
          binary: ${{ matrix.image.binary }}
          clone-super-league: ${{ matrix.image.clone_super_league }}
          service-version: ${{ needs.release.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ needs.release.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ needs.release.outputs.major_minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.image_name }}:${{ needs.release.outputs.version }}
